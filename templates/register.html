<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Nihon</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body class="auth-page">
    <div class="kana-drift" aria-hidden="true">
      <span class="kana kanji-one">学</span><span class="kana kana-one">あ</span>
      <span class="kana kanji-two">日</span><span class="kana kana-two">ひ</span>
      <span class="kana kanji-three">本</span><span class="kana kana-three">ね</span>
    </div>
    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-mark" aria-hidden="true">日<span>本</span></div>
        <p class="eyebrow">Begin your practice</p>
        <h1>Create your account</h1>
        <p class="auth-intro">Make a little progress, one character at a time.</p>
        <form method="POST" class="auth-form">
          <div class="auth-field">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required />
          </div>
          <button type="submit">Start learning</button>
        </form>
        <p class="auth-switch">Already learning? <a href="{{ url_for('login') }}">Sign in</a></p>
      </section>
    </main>
  </body>
</html>
